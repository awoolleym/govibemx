<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>GoVibeMX Driver Remote</title>
<!-- Install as an app: phone browser menu → "Add to Home screen" -->
<link rel="manifest" href="remote.webmanifest">
<meta name="theme-color" content="#070b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GoVibe Remote">
<link rel="apple-touch-icon" href="remote-icon-192.png">
<link rel="icon" href="remote-icon-192.png">
<style>
  /* Phone remote for the rear screen (infotainment.html). Pick today's trip; the tablet switches. */
  :root {
    color-scheme: dark;
    --bg: #070b10;
    --panel: #121820;
    --line: #2a313c;
    --text: #f2f5f8;
    --muted: #8f9aa8;
    --route: #FFB300;
    --ok: #2ecc71;
    --warn: #f1c40f;
    --bad: #e74c3c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .tablet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .tablet .k { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .tablet .v { font-size: 18px; font-weight: 700; }
  .tablet .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  #controls { display: flex; flex-direction: column; gap: 14px; }
  .trips { display: flex; flex-direction: column; gap: 10px; }
  .trips button { display: flex; align-items: center; gap: 14px; width: 100%; background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; text-align: left; cursor: pointer; font-family: inherit; }
  .trips button .ico { font-size: 30px; }
  .trips button small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .trips button.on { border-color: var(--route); background: #2a2108; }
  .trips button:active { transform: scale(.98); }
  .trips button:disabled { opacity: .5; }
  .new-ride { width: 100%; background: #0f2a1a; color: #fff; border: 2px solid var(--ok); border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; text-align: left; cursor: pointer; font-family: inherit; }
  .new-ride small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .new-ride:active { transform: scale(.98); }
  .bye-btn { background: #2a1a05; border-color: #FFB300; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  [hidden] { display: none !important; }

  /* PIN lock */
  .lock { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
  .lock h2 { margin: 0; font-size: 18px; }
  .lock p { margin: 0; color: var(--muted); font-size: 14px; }
  .pin-dots { display: flex; gap: 12px; height: 18px; }
  .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); }
  .pin-dots span.on { background: var(--route); border-color: var(--route); }
  .keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
  .keypad button { height: 60px; border-radius: 14px; border: 1px solid var(--line); background: #1b222c; color: var(--text); font-size: 24px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .keypad button:active { transform: scale(.96); }
  .keypad .wide { font-size: 15px; }
  .lock .ok-btn { width: 100%; max-width: 236px; background: var(--route); color: #1a1200; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .lock .ok-btn:disabled { opacity: .4; }
  .lock-msg { min-height: 18px; font-size: 13px; color: var(--warn); }
  .bar { display: flex; gap: 8px; justify-content: flex-end; }
  .k { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .guest { width: 100%; background: #0b1016; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit; }
  .screen-top { display: flex; gap: 10px; }
  .home-btn { flex: 1; background: #1b222c; color: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px; font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .langs { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .langs button { background: transparent; color: var(--muted); border: none; padding: 0 18px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .langs button.on { background: #00C9FF; color: #002b36; }
  .sections { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .sections button { display: flex; align-items: center; gap: 8px; background: #1b222c; color: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 11px 10px; font-size: 14px; font-weight: 700; text-align: left; cursor: pointer; font-family: inherit; }
  .sections button .e { font-size: 20px; }
  .sections button.on { border-color: #00C9FF; }
  button.pressed { filter: brightness(1.45); transform: scale(.97); transition: none; }
  .sec-h { grid-column: 1 / -1; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 6px 0 -2px 2px; }
  .sec-h:first-child { margin-top: 0; }
  .sections .mute-tg { grid-column: 1 / -1; flex-direction: row; text-align: left; }
  .sections button:active, .home-btn:active { transform: scale(.97); }
  .url-row { display: flex; gap: 8px; }
  .url-row button { background: #00C9FF; color: #002b36; border: none; border-radius: 10px; padding: 0 16px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { background: #1b222c; color: #cfd8e3; border: 1px solid var(--line); border-radius: 16px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .sent { font-size: 12px; color: var(--ok); min-height: 16px; }
  .bar button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
  /* ---- Phone layout: Samsung Galaxy S26 Ultra / Z Flip5 (main screen ~412 px wide) ---- */
  body { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
  main { gap: 12px; }
  #controls { gap: 12px; }
  .head h1 { font-size: 19px; }
  #status { position: sticky; top: calc(6px + env(safe-area-inset-top, 0px)); z-index: 5; padding: 10px 12px; gap: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.55); background: rgba(18,24,32,.96); backdrop-filter: blur(8px); }
  #status .v { font-size: 16px; }
  #status .meta { font-size: 12px; }
  .card { padding: 12px; gap: 8px; }
  .trips { gap: 8px; }
  .trips button { padding: 12px; font-size: 16px; gap: 12px; min-height: 56px; }
  .trips button .ico { font-size: 26px; }
  .trips button small { font-size: 12px; }
  .trip-group { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .trip-group.on { border-color: var(--route); background: #2a2108; }
  .trip-group .gt { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; }
  .trip-group .gt .ico { font-size: 26px; }
  .trip-group .gt small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .trips { display: grid; grid-template-columns: 1fr 1fr; }
  .trips > button { flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px; }
  .trips > button .ico { font-size: 24px; line-height: 1; }
  .trips > button small { font-size: 11px; line-height: 1.3; }
  .trip-group { grid-column: 1 / -1; }
  .trip-group .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
  .trips .trip-group .opts button { min-height: 40px; padding: 8px 4px; justify-content: center; font-size: 14px; font-weight: 800; border-radius: 20px; text-align: center; border-width: 2px; background: #1b222c; }
  .trips .trip-group .opts button.on { background: var(--route); color: #1a1200; border-color: var(--route); }
  .new-ride { padding: 14px; font-size: 17px; min-height: 56px; }
  .sections { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .sections button { padding: 10px 8px; font-size: 13px; min-height: 48px; }
  .bright { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .bright button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; padding: 6px 2px; border-radius: 12px; border: 2px solid var(--line); background: #1b222c; color: #fff; font-size: 20px; cursor: pointer; font-family: inherit; }
  .bright button small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .bright button.cur { border-color: #FFD740; background: #2a2108; }
  .bright button.off { background: #000; }
  .bright button.off.cur { border-color: var(--bad); }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: #1b222c; color: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; text-align: left; cursor: pointer; font-family: inherit; }
  .toggle small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .toggle .sw { flex-shrink: 0; width: 48px; height: 28px; border-radius: 14px; background: #3a4350; position: relative; transition: background .2s; }
  .toggle .sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
  .toggle.on .sw { background: var(--ok); }
  .toggle.on .sw i { left: 23px; }
  .quick { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(7,11,16,0), rgba(7,11,16,.96) 30%); }
  .quick .sent { text-align: center; min-height: 16px; margin-bottom: 4px; }
  .quick-row { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; }
  .quick-row > button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; font-size: 16px; font-weight: 800; border: 2px solid var(--line); background: #1b222c; color: #fff; cursor: pointer; font-family: inherit; }
  .quick-row > button span { font-size: 22px; }
  .quick-row .bye-btn { background: #2a1a05; border-color: #FFB300; }
  .quick-row .welcome-btn { background: #2a0a1f; border-color: #FF4081; }
  /* Four buttons on a phone: icon above the name so they fit */
  @media (max-width: 480px) {
    .quick-row { gap: 6px; }
    .quick-row > button { flex-direction: column; gap: 1px; font-size: 12px; min-height: 58px; padding: 4px 2px; }
    .quick-row > button span { font-size: 20px; }
    .quick-row .langs button { padding: 0 11px; font-size: 15px; }
  }
  .quick-row .langs { border-radius: 16px; }
  .quick-row .langs button { padding: 0 14px; min-height: 52px; }
  .bar { flex-wrap: wrap; justify-content: center; }
  .phone-net { font-size: 12px; font-weight: 700; color: var(--warn); }
  .phone-net[hidden] { display: none; }
  .bar button.on { color: var(--ok); border-color: var(--ok); }
  button:active { filter: brightness(1.25); }
  /* Wider phones and unfolded / landscape: three columns of sections */
  @media (min-width: 400px) { .sections { grid-template-columns: repeat(3, 1fr); } .sections button { flex-direction: column; text-align: center; gap: 2px; font-size: 12px; } }
  /* Z Flip5 Flex Window (cover screen, ~360 × 374): only the essentials, big targets */
  @media (max-height: 520px) and (max-width: 520px) {
    body { padding: 6px 8px 84px; }
    .head, .more, .card:has(#guest) .k, .trips button small, .trip-group .gt small, .new-ride small { display: none; }
    #status { position: static; padding: 6px 10px; } #status .meta { display: none; }
    .card { padding: 8px; gap: 6px; } .card .k { font-size: 10px; }
    .trips button { min-height: 44px; padding: 8px 10px; font-size: 14px; } .trips button .ico { font-size: 20px; }
    .sections { grid-template-columns: repeat(3, 1fr); } .sections button { font-size: 11px; min-height: 44px; padding: 6px 4px; }
    .new-ride { min-height: 46px; padding: 10px; font-size: 15px; }
    .quick-row > button { min-height: 50px; font-size: 14px; } .quick-row .langs button { min-height: 46px; padding: 0 10px; }
  }
</style>
</head>
<body>
<main>
  <header class="head">
    <h1>🚐 GoVibeMX Remote</h1>
    <p class="sub">Trip, language and what the rear screen shows.</p>
  </header>

  <section class="lock" id="lock">
    <h2 id="lock-title">🔒 Enter driver PIN</h2>
    <p id="lock-hint">Connecting…</p>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="keypad" id="keypad"></div>
    <button class="ok-btn" id="pin-ok" disabled>Unlock</button>
    <div class="lock-msg" id="lock-msg"></div>
  </section>

  <section id="controls" hidden>
  <div class="tablet" id="status">
    <div class="v"><span class="dot" id="dot"></span><span id="tablet-line">Connecting…</span></div>
    <div class="meta" id="tablet-meta"></div>
    <div class="phone-net" id="phone-net" hidden></div>
  </div>

  <div class="card">
    <div class="k">New passenger</div>
    <input class="guest" id="guest" type="text" maxlength="30" placeholder="Passenger name (optional), e.g. Sarah & Tom" autocomplete="off" enterkeyhint="go">
    <button class="new-ride" id="new-ride">🆕 New ride<small>Clear the screen for the next passenger (the name is used on the Welcome screen)</small></button>
  </div>

  <div class="card">
    <div class="k">Trip</div>
    <div class="trips" id="trips"></div>
  </div>

  <div class="card">
    <div class="k">Screen</div>
    <div class="bright" id="bright">
      <button data-b="1">☀️<small>100%</small></button>
      <button data-b="0.7">🌤️<small>70%</small></button>
      <button data-b="0.4">🌙<small>40%</small></button>
      <button data-b="0.15">🌑<small>15%</small></button>
      <button data-p="off" class="off">⏻<small>Off</small></button>
      <button data-p="on" class="on-btn">💡<small>On</small></button>
    </div>
    <button class="toggle on" id="trail-btn"><span class="tg-l">〰️ Traveled path on the map<small>Off = only the van and the route (best for Uber rides)</small></span><span class="sw"><i></i></span></button>
  </div>

  <div class="card">
    <div class="k">Open on the tablet</div>
    <div class="sections" id="sections"></div>
  </div>

  <div class="card more">
    <div class="k">Show a page or video</div>
    <div class="url-row"><input class="guest" id="web-url" type="url" inputmode="url" enterkeyhint="go" placeholder="https://… or a YouTube link" autocomplete="off"><button id="web-go">Show</button></div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="bar more"><button id="reconnect">🔄 Reconnect</button><button id="wake">📱 Keep screen on</button><button id="change-pin">Change PIN</button><button id="lock-now">🔒 Lock</button></div>

  <!-- Always within thumb reach -->
  <nav class="quick">
    <div class="sent" id="sent"></div>
    <div class="quick-row">
      <button class="home-btn" data-cmd="home"><span>🏠</span>Home</button>
      <div class="langs"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
      <button class="welcome-btn" id="welcome-btn"><span>🎉</span>Welcome</button>
      <button class="bye-btn" id="bye-btn"><span>👋</span>Goodbye</button>
    </div>
  </nav>
  </section>

  <p class="note">Van: <b id="van"></b>. You can also change the trip on the tablet itself: press and hold the clock for 1.5 seconds.</p>
</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { getDatabase, ref, onValue, set, goOffline, goOnline } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  // Must match VAN_ID in infotainment.html. Add ?van=van2 to the link for a second vehicle.
  const VAN_ID = new URLSearchParams(location.search).get('van') || 'van1';

  // Keep in sync with TRIPS in infotainment.html.
  const OPTIONS = [
    { id: 'none',     icon: '🚗', name: 'City ride',                     shows: 'No trip map · entertainment only' },
    { id: 'ride',     icon: '🚕', name: 'Live Map (Uber / app ride)',    shows: 'Live map, neighborhoods and sights + CDMX Facts' },
    { id: 'city',     icon: '🗺️', name: 'CDMX City Tour',                shows: 'Live map with neighborhoods, alcaldías and sights + CDMX Facts' },
    { id: 'balloon',  icon: '🎈', name: 'Hot Air Balloon · Teotihuacán', shows: 'Map to Balloon\'s Paradise + Teotihuacán guide + Balloon 101' },
    { id: 'pyramids', icon: '🛕', name: 'Pyramids of Teotihuacán',       shows: 'Map to the pyramids + Teotihuacán guide' },
    { id: 'airport1', icon: '✈️', name: 'Airport · AICM T1', short: 'AICM T1', group: 'airport' },
    { id: 'airport2', icon: '✈️', name: 'Airport · AICM T2', short: 'AICM T2', group: 'airport' },
    { id: 'aifa',     icon: '✈️', name: 'Airport · AIFA',    short: 'AIFA',    group: 'airport' },
    { id: 'home4s',   icon: '🏨', name: 'Back to the Four Seasons', short: '🏨 Four Seasons', group: 'back' },
    { id: 'home',     icon: '🏁', name: 'Back to Mexico City',      short: '🌎 Anywhere',     group: 'back' }
  ];
  const GROUPS = { back: { icon: '🏁', name: 'Back to Mexico City', shows: 'Route from where you are · no guides' }, airport: { icon: '✈️', name: 'Airport', shows: 'Route from where you are to the terminal + flight tips' } };
  const NAMES = Object.fromEntries(OPTIONS.map(o => [o.id, o.icon + ' ' + o.name]));

  // Sections the tablet can open (value → tablet screen it shows).
  // Sections the tablet can open (value → tablet screen it shows), grouped in the order you use them on a ride.
  const SECTION_GROUPS = [
    { g: '🙋 Passenger', items: [
      { v: 'welcome', e: '🎉', n: 'Welcome screen', screen: 'welcome' },
      { v: 'host', e: '🧑‍✈️', n: 'Host & Wi-Fi', screen: 'welcome' },
      { v: 'review', e: '⭐', n: 'Ask for a review' },
      { v: 'bye', e: '👋', n: 'Goodbye', screen: 'bye' },
      { v: 'services', e: '🚐', n: 'Services' }
    ] },
    { g: '🗺️ Trip & guides', items: [
      { v: 'map', e: '🗺️', n: 'Live map', screen: 'map-screen' },
      { v: 'teo', e: '🛕', n: 'Teotihuacán guide', screen: 'guide' },
      { v: 'balloon', e: '🎈', n: 'Balloon 101', screen: 'guide' }
    ] },
    { g: '📺 GoVibe TV', items: [
      { v: 'tvch:milenio', e: '🇲🇽', n: 'Milenio News · live', screen: 'tv-screen', tvch: 'milenio' },
      { v: 'tvch:cbs', e: '🇺🇸', n: 'CBS News · live', screen: 'tv-screen', tvch: 'cbs' },
      { v: 'tvch:cdmx-day', e: '🌆', n: 'CDMX 4K · day', screen: 'tv-screen', tvch: 'cdmx-day' },
      { v: 'tvch:cdmx-night', e: '🌃', n: 'CDMX 4K · night', screen: 'tv-screen', tvch: 'cdmx-night' },
      { v: 'tv:mx', e: '🎬', n: 'All videos', screen: 'tv-screen' }
    ] },
    { g: '🇲🇽 Explore CDMX', items: [
      { v: 'explorer:hoods', e: '🏘️', n: 'CDMX Explorer', screen: 'explorer-screen' },
      { v: 'explorer:museums', e: '🏛️', n: 'Museums', screen: 'explorer-screen' },
      { v: 'eat', e: '🍽️', n: 'Eat & Drink', screen: 'eat-screen' },
      { v: 'transit', e: '🚇', n: 'Getting Around', screen: 'transit-screen' },
      { v: 'explorer:spanish', e: '🗣️', n: 'Spanish 101', screen: 'explorer-screen' }
    ] },
    { g: '🎉 Fun', items: [
      { v: 'spotify', e: '🎵', n: 'Spotify Jam' },
      { v: 'streaming', e: '🍿', n: 'Streaming apps' },
      { v: 'arcade', e: '🕹️', n: 'Arcade games', screen: 'games-screen' },
      { v: 'games', e: '🎮', n: 'Memory game', screen: 'games-screen' },
      { v: 'explorer:quiz', e: '🎯', n: 'CDMX Quiz', screen: 'explorer-screen' },
      { v: 'kids:spot', e: '🦎', n: 'Kids: Spot it!', screen: 'kids-screen' }
    ] }
  ];
  const SECTIONS = SECTION_GROUPS.flatMap(x => x.items);
  const SCREEN_NAMES = { 'home': 'Home', 'map-screen': 'Live map', 'guide': 'Teotihuacán guide', 'explorer-screen': 'CDMX Explorer', 'eat-screen': 'Eat & Drink', 'kids-screen': 'Kids Zone', 'transit-screen': 'Getting Around', 'web-screen': 'Web page', 'tv-screen': 'GoVibe TV', 'games-screen': 'Games', 'welcome': 'Welcome screen', 'bye': 'Goodbye screen' };

  const $ = (id) => document.getElementById(id);
  $('van').textContent = VAN_ID;
  let current = null, tablet = null, lastTap = 0;

  // ---- PIN lock ----
  // The PIN is stored as a SHA-256 hash in rearScreen/<van>/pinHash, so every phone shares it.
  // It keeps passengers and strangers with the link out; it is not bank-grade security.
  const MIN_PIN = 4, MAX_PIN = 6;
  const OK_KEY = 'gv_driver_ok_' + VAN_ID;
  let pinHash;              // undefined = still loading, null = no PIN yet
  let entry = '', firstEntry = null, mode = 'unlock', fails = 0, lockedUntil = 0;
  let savePinHash = null;   // set once Firebase is ready

  async function hashPin(pin) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('govibemx:' + VAN_ID + ':' + pin));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function remembered() { try { return localStorage.getItem(OK_KEY); } catch (e) { return null; } }
  function remember(h) { try { h ? localStorage.setItem(OK_KEY, h) : localStorage.removeItem(OK_KEY); } catch (e) {} }

  $('keypad').innerHTML = ['1','2','3','4','5','6','7','8','9','⌫','0','Clear']
    .map(k => `<button data-k="${k}" class="${k.length > 1 ? 'wide' : ''}">${k}</button>`).join('');

  function showLock(m, msg) {
    mode = m; entry = ''; if (m !== 'confirm' && m !== 'confirm-change') firstEntry = null;
    $('controls').hidden = true; $('lock').hidden = false;
    const t = {
      unlock: ['🔒 Enter driver PIN', 'Enter the PIN to change what the rear screen shows.', 'Unlock'],
      create: ['🔑 Create a driver PIN', 'First time here: choose a ' + MIN_PIN + '–' + MAX_PIN + ' digit PIN. All your phones will use it.', 'Next'],
      confirm: ['🔑 Confirm your PIN', 'Enter the same PIN again.', 'Save PIN'],
      change: ['🔑 New PIN', 'Choose a new ' + MIN_PIN + '–' + MAX_PIN + ' digit PIN. Other phones will need it next time.', 'Next'],
      'confirm-change': ['🔑 Confirm new PIN', 'Enter the new PIN again.', 'Save PIN']
    }[m];
    $('lock-title').textContent = t[0]; $('lock-hint').textContent = t[1]; $('pin-ok').textContent = t[2];
    $('lock-msg').textContent = msg || '';
    drawDots();
  }
  function showControls() { $('lock').hidden = true; $('controls').hidden = false; }
  function drawDots() {
    const n = Math.max(MIN_PIN, entry.length);
    $('pin-dots').innerHTML = Array.from({ length: n }, (_, i) => `<span class="${i < entry.length ? 'on' : ''}"></span>`).join('');
    $('pin-ok').disabled = entry.length < MIN_PIN || pinHash === undefined;
  }
  // Decide what to show whenever the stored PIN loads or changes.
  function checkAccess() {
    if (pinHash === undefined) return;
    if (pinHash === null) { if (mode !== 'confirm') showLock('create'); return; }
    if (remembered() === pinHash) { if (mode !== 'change' && mode !== 'confirm-change') showControls(); return; }
    if (!$('controls').hidden || mode === 'create' || mode === 'confirm') showLock('unlock', $('controls').hidden ? '' : 'The PIN was changed on another phone.');
  }

  $('keypad').addEventListener('click', (e) => {
    const k = e.target.closest('button[data-k]'); if (!k) return;
    const v = k.dataset.k;
    if (v === '⌫') entry = entry.slice(0, -1);
    else if (v === 'Clear') entry = '';
    else if (entry.length < MAX_PIN) entry += v;
    $('lock-msg').textContent = ''; drawDots();
  });
  document.addEventListener('keydown', (e) => {
    if ($('lock').hidden) return;
    if (/^[0-9]$/.test(e.key) && entry.length < MAX_PIN) entry += e.key;
    else if (e.key === 'Backspace') entry = entry.slice(0, -1);
    else if (e.key === 'Enter') return $('pin-ok').click();
    else return;
    drawDots();
  });
  $('pin-ok').addEventListener('click', async () => {
    if (entry.length < MIN_PIN) return;
    const h = await hashPin(entry);
    if (mode === 'unlock') {
      if (Date.now() < lockedUntil) { $('lock-msg').textContent = 'Too many tries. Wait ' + Math.ceil((lockedUntil - Date.now()) / 1000) + ' s.'; return; }
      if (h === pinHash) { fails = 0; remember(h); showControls(); }
      else {
        fails++; entry = ''; drawDots();
        if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; $('lock-msg').textContent = 'Too many tries. Wait 30 s.'; }
        else $('lock-msg').textContent = 'Wrong PIN. Try again.';
      }
    } else if (mode === 'create' || mode === 'change') {
      firstEntry = h; showLock(mode === 'create' ? 'confirm' : 'confirm-change');
    } else {
      if (h !== firstEntry) { showLock(mode === 'confirm' ? 'create' : 'change', 'The PINs didn\'t match. Start again.'); return; }
      if (!savePinHash) { $('lock-msg').textContent = 'Not connected yet. Try again in a moment.'; return; }
      try { await savePinHash(h); remember(h); pinHash = h; mode = 'unlock'; showControls(); }
      catch (err) { $('lock-msg').textContent = 'Couldn\'t save the PIN: ' + err.message; }
    }
  });
  $('lock-now').addEventListener('click', () => { remember(null); showLock('unlock'); });
  $('change-pin').addEventListener('click', () => showLock('change'));
  showLock('unlock');

  function renderTrips() {
    const done = {};
    $('trips').innerHTML = OPTIONS.map(o => {
      if (!o.group) return `<button data-id="${o.id}" class="${o.id === current ? 'on' : ''}"><span class="ico">${o.icon}</span><span>${o.name}<small>${o.shows}</small></span></button>`;
      if (done[o.group]) return '';
      done[o.group] = true;
      const g = GROUPS[o.group], opts = OPTIONS.filter(x => x.group === o.group);
      const on = opts.some(x => x.id === current);
      return `<div class="trip-group ${on ? 'on' : ''}"><div class="gt"><span class="ico">${g.icon}</span><span>${g.name}<small>${g.shows}</small></span></div>` +
        `<div class="opts">${opts.map(x => `<button data-id="${x.id}" class="${x.id === current ? 'on' : ''}">${x.short}</button>`).join('')}</div></div>`;
    }).join('');
  }
  // A short buzz so you feel the tap without looking (Android phones)
  document.addEventListener('click', (e) => { if (e.target.closest('button') && navigator.vibrate) navigator.vibrate(12); });
  // Keep the phone's screen on while the remote is open (for a phone on a dash mount)
  let wakeLock = null, wantWake = false;
  const grabWake = async () => {
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { wakeLock = null; }
  };
  $('wake').addEventListener('click', async () => {
    if (!('wakeLock' in navigator)) { $('wake').textContent = '📱 Not supported here'; return; }
    wantWake = !wantWake;
    if (wantWake) await grabWake(); else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    $('wake').classList.toggle('on', wantWake);
    $('wake').textContent = wantWake ? '📱 Screen stays on' : '📱 Keep screen on';
  });
  // Android drops the lock when the app goes to the background; take it back on return
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantWake && !wakeLock) grabWake(); });
  $('guest').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('new-ride').click(); });

  function renderTablet() {
    const dot = $('dot');
    if (!tablet || !tablet.at) {
      dot.className = 'dot warn';
      $('tablet-line').textContent = 'Not seen yet';
      $('tablet-meta').textContent = 'Open the rear screen on the tablet to connect it.';
      return;
    }
    const ago = Math.max(0, Math.round((Date.now() - tablet.at) / 1000));
    const fresh = ago < 90;
    dot.className = 'dot ' + (fresh ? 'ok' : 'bad');
    $('tablet-line').textContent = (NAMES[tablet.trip] || tablet.trip) + (tablet.trip !== current && current ? ' · switching…' : '');
    const bits = [];
    bits.push(fresh ? 'Online · seen ' + ago + ' s ago' : 'Offline · last seen ' + Math.max(1, Math.round(ago / 60)) + ' min ago · it reconnects by itself when signal is back');
    if (tablet.kmLeft != null) bits.push(tablet.kmLeft + ' km to go');
    if (tablet.gps) bits.push('GPS: ' + ({ ok: 'live', wait: 'searching', denied: 'off', demo: 'demo' }[tablet.gps] || tablet.gps));
    if (tablet.screen) bits.push('Showing: ' + (SCREEN_NAMES[tablet.screen] || tablet.screen));
    if (tablet.lang) bits.push(tablet.lang.toUpperCase());
    $('trail-btn').classList.toggle('on', tablet.trail !== false);
    if (Date.now() - lastTap > 4000) $('sound-btn').classList.toggle('on', !tablet.muted);
    if (tablet.off) bits.push('Screen OFF');
    else if (tablet.bright != null && tablet.bright < 1) bits.push('Brightness ' + Math.round(tablet.bright * 100) + '%');
    document.querySelectorAll('#bright button').forEach(b => b.classList.toggle('cur', b.dataset.p === 'off' ? !!tablet.off : (!tablet.off && b.dataset.b != null && Math.abs(+b.dataset.b - (tablet.bright || 1)) < 0.01)));
    // Right after a tap, keep what was tapped highlighted until the tablet's new status arrives
    const fresh_tap = Date.now() - lastTap < 4000;
    if (!fresh_tap) document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === tablet.lang));
    // Light up what the tablet is showing right now
    const shown = (tablet.screen === 'tv-screen' && tablet.tvch && SECTIONS.find(y => y.tvch === tablet.tvch)) ||
      SECTIONS.find(y => y.screen && y.screen === tablet.screen && !y.tvch); // one button per screen
    if (!fresh_tap) document.querySelectorAll('#sections button[data-open]').forEach(b => b.classList.toggle('on', !!shown && b.dataset.open === shown.v));
    $('tablet-meta').textContent = bits.join(' · ');
  }

  $('sections').innerHTML = SECTION_GROUPS.map(grp => `<div class="sec-h">${grp.g}</div>` + grp.items.map(x => `<button data-open="${x.v}"><span class="e">${x.e}</span>${x.n}</button>`).join('') +
    (grp.g.indexOf('TV') >= 0 ? `<button class="toggle on mute-tg" id="sound-btn"><span class="tg-l">🔊 TV sound<small>Off = muted (the 4K channels start muted)</small></span><span class="sw"><i></i></span></button>` : '')).join('');
  renderTrips(); renderTablet();
  setInterval(renderTablet, 5000);

  try {
    const app = initializeApp({
      apiKey: 'AIzaSyAqFnjf1i-8Qm95Xzp98FFO0ABUxb7hzn4',
      authDomain: 'govibebooking.firebaseapp.com',
      databaseURL: 'https://govibebooking-default-rtdb.firebaseio.com',
      projectId: 'govibebooking'
    });
    try { await signInAnonymously(getAuth(app)); } catch (e) { /* rules may allow access without login */ }
    const db = getDatabase(app);
    const base = 'rearScreen/' + VAN_ID;

    onValue(ref(db, base + '/trip'), snap => { current = snap.val(); renderTrips(); renderTablet(); },
      err => { $('tablet-line').textContent = 'Can\'t reach the database'; $('tablet-meta').textContent = err.message; });
    onValue(ref(db, base + '/tablet'), snap => { tablet = snap.val(); renderTablet(); });

    // ---- Connection watchdog: phones pause the connection in the background, and Starlink / mobile
    // data drop out. Watch .info/connected and force a reconnect when it stays down.
    let connected = false, downSince = Date.now(), lastKick = 0;
    const kick = (force) => {
      if (!force && Date.now() - lastKick < 20000) return;
      lastKick = Date.now();
      try { goOffline(db); } catch (e) {}
      setTimeout(() => { try { goOnline(db); } catch (e) {} }, 400);
    };
    onValue(ref(db, '.info/connected'), snap => {
      connected = !!snap.val();
      if (connected) { downSince = 0; $('phone-net').hidden = true; }
      else {
        downSince = downSince || Date.now();
        $('phone-net').textContent = navigator.onLine ? '📡 Phone reconnecting…' : '📡 Phone has no signal';
        $('phone-net').hidden = false;
      }
    });
    window.addEventListener('online', () => setTimeout(() => kick(true), 1000));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !connected) kick(true); });
    setInterval(() => { if (navigator.onLine && !connected && downSince && Date.now() - downSince > 15000) kick(); }, 5000);
    savePinHash = (h) => set(ref(db, base + '/pinHash'), h);
    onValue(ref(db, base + '/pinHash'), snap => {
      pinHash = snap.val() || null;
      if (mode === 'unlock') $('lock-hint').textContent = 'Enter the PIN to change what the rear screen shows.';
      drawDots(); checkAccess();
    }, err => { $('lock-hint').textContent = 'Can\'t reach the database: ' + err.message; });

    $('new-ride').addEventListener('click', async () => {
      if ($('controls').hidden) return;
      const b = $('new-ride'); b.disabled = true;
      b.firstChild.textContent = '⏳ New ride… ';
      try { await set(ref(db, base + '/newRide'), { at: Date.now(), name: $('guest').value.trim() }); b.firstChild.textContent = '✅ Sent: new ride '; $('guest').value = ''; }
      catch (err) { $('tablet-meta').textContent = 'Couldn\'t send: ' + err.message; }
      setTimeout(() => { b.firstChild.textContent = '🆕 New ride'; b.disabled = false; }, 2500);
    });

    // Screen commands: go home, change language, open a section.
    // Feedback right away (don't wait for the round trip through Firebase / Starlink), ✅ when it's confirmed
    let sentTimer = null;
    const sent = (txt) => { clearTimeout(sentTimer); $('sent').textContent = txt; sentTimer = setTimeout(() => { $('sent').textContent = ''; }, 2500); };
    const sendCmd = (a, v, label) => {
      if ($('controls').hidden) return;
      lastTap = Date.now();
      sent('⏳ ' + label + '…');
      set(ref(db, base + '/cmd'), { a, v: v || '', at: Date.now() })
        .then(() => sent('✅ ' + label))
        .catch((err) => sent('Couldn\'t send: ' + err.message));
    };
    // A short flash on whatever was tapped
    document.addEventListener('pointerdown', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 250);
    });
    document.querySelector('.home-btn').addEventListener('click', () => sendCmd('home', '', 'Home'));
    document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.langs button').forEach(x => x.classList.toggle('on', x === b)); // show it now
      sendCmd('lang', b.dataset.lang, b.dataset.lang === 'es' ? 'Español' : 'English');
    }));
    // Point the screen at any page (it opens inside the tablet's viewer; YouTube links play on GoVibe TV)
    const PRESETS = [
      { n: '🏠 govibemx.com', u: 'https://govibemx.com/' },
      { n: '🚐 Services', u: 'https://govibemx.com/services/' },
      { n: '🌴 Experiences', u: 'https://govibemx.com/experiences' }
    ];
    $('presets').innerHTML = PRESETS.map((p, i) => `<button data-i="${i}">${p.n}</button>`).join('');
    const sendWeb = async (u, label) => {
      if ($('controls').hidden) return;
      u = u.trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      u = u.replace(/^http:/i, 'https:');
      try { await set(ref(db, base + '/cmd'), { a: 'web', v: u, at: Date.now() }); $('sent').textContent = '✅ Sent: ' + (label || u); }
      catch (err) { $('sent').textContent = 'Couldn\'t send: ' + err.message; }
      setTimeout(() => { $('sent').textContent = ''; }, 2500);
    };
    $('web-go').addEventListener('click', () => { if ($('web-url').value.trim()) { sendWeb($('web-url').value); $('web-url').value = ''; } });
    $('web-url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('web-go').click(); });
    $('presets').addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) sendWeb(PRESETS[+b.dataset.i].u, PRESETS[+b.dataset.i].n); });
    $('bye-btn').addEventListener('click', () => sendCmd('bye', '', 'Goodbye screen'));
    $('welcome-btn').addEventListener('click', () => sendCmd('welcome', 'welcome', 'Welcome screen'));
    // Reconnect this phone and ask the tablet to report in
    $('reconnect').addEventListener('click', () => { kick(true); setTimeout(() => sendCmd('ping', '', 'Reconnect · waiting for the tablet'), 1500); });
    $('sound-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const on = !$('sound-btn').classList.contains('on');
      $('sound-btn').classList.toggle('on', on);
      sendCmd('mute', on ? 'off' : 'on', on ? 'TV sound on' : 'TV muted');
    });
    $('trail-btn').addEventListener('click', () => {
      const on = !$('trail-btn').classList.contains('on');
      $('trail-btn').classList.toggle('on', on); // show it right away; the tablet's status confirms it
      sendCmd('trail', on ? 'on' : 'off', on ? 'Traveled path: on' : 'Traveled path: off');
    });
    $('bright').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.p === 'off') sendCmd('off', '', 'Screen off');
      else if (b.dataset.p === 'on') sendCmd('on', '', 'Screen on');
      else sendCmd('bright', +b.dataset.b, 'Brightness ' + Math.round(b.dataset.b * 100) + '%');
    });
    $('sections').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-open]'); if (!b) return;
      const sec = SECTIONS.find(x => x.v === b.dataset.open);
      if (sec.screen) document.querySelectorAll('#sections button[data-open]').forEach(x => x.classList.toggle('on', x === b));
      if (sec.tvch) $('sound-btn').classList.toggle('on', sec.tvch.indexOf('cdmx') < 0); // 4K channels start muted
      sendCmd(sec.v === 'welcome' || sec.v === 'bye' ? sec.v : 'open', sec.v, sec.n);
    });

    $('trips').addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-id]');
      if (!b || $('controls').hidden) return;
      // Select it on the remote right away; Firebase confirms in the background
      const before = current; current = b.dataset.id; renderTrips();
      sent('⏳ ' + (NAMES[current] || current) + '…');
      try { await set(ref(db, base + '/trip'), current); sent('✅ ' + (NAMES[current] || current)); }
      catch (err) { current = before; renderTrips(); $('tablet-meta').textContent = 'Couldn\'t switch: ' + err.message; }
    });
  } catch (e) {
    $('lock-hint').textContent = 'No connection. Check the phone\'s internet and reload.';
    $('dot').className = 'dot bad';
    $('tablet-line').textContent = 'No connection';
    $('tablet-meta').textContent = 'Check the phone\'s internet and reload.';
  }
</script>
<script>
  // Offline cache (sw.js): the remote opens even without signal and reconnects when it's back.
  // Its own script, so it installs even if Firebase can't load.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
